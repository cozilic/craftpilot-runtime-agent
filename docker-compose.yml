services:
  runtime-agent:
    image: craftpilot-runtime-agent:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: craftpilot-runtime-agent
    restart: unless-stopped
    # Compose drops capabilities for a non-root process. Run as root with only
    # the file-operation capabilities migration needs on the data bind.
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    # Linux setup detects the socket GID; Desktop setup probes the mounted socket.
    group_add:
      - "${DOCKER_GID:-0}"
      - "33"
    command:
      - /bin/sh
      - -c
      - umask 0002 && exec python /opt/craftpilot-runtime-agent/craftpilot_runtime_agent.py
    environment:
      CRAFTPILOT_MASTER_URL: ${CRAFTPILOT_MASTER_URL:-https://craftpilot.se}
      CRAFTPILOT_NODE_ID: ${CRAFTPILOT_NODE_ID:-}
      CRAFTPILOT_REGISTRATION_TOKEN: ${CRAFTPILOT_REGISTRATION_TOKEN:-}
      CRAFTPILOT_AGENT_STATE_DIR: /var/lib/craftpilot-agent
      CRAFTPILOT_SERVER_DATA_ROOT: /srv/craftpilot/servers
      # The Docker daemon must see this exact host path for child server mounts.
      CRAFTPILOT_DOCKER_SERVER_DATA_ROOT: "${CRAFTPILOT_DOCKER_SERVER_DATA_ROOT:-${CRAFTPILOT_SERVER_DATA_HOST_PATH:-/srv/craftpilot/servers}}"
      CRAFTPILOT_SERVER_DATA_GID: ${CRAFTPILOT_SERVER_DATA_GID:-33}
      CRAFTPILOT_DOCKER_NETWORK: ${CRAFTPILOT_DOCKER_NETWORK:-craftpilot-servers}
      CRAFTPILOT_LOG_LEVEL: ${CRAFTPILOT_LOG_LEVEL:-INFO}
    volumes:
      - "${CRAFTPILOT_DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock"
      - agent_state:/var/lib/craftpilot-agent
      - type: bind
        source: "${CRAFTPILOT_SERVER_DATA_HOST_PATH:-/srv/craftpilot/servers}"
        target: /srv/craftpilot/servers
    # Run only on a trusted host; Docker socket access is effectively host-root control.

volumes:
  agent_state:
